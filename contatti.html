<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta name="description" content="Segreteria eventi della Dr. Ines Carrato: organizzazione di congressi, corsi e incontri.">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVIGAZIONE -->
  <header class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="brand">
        <img src="assets/stemma.png" alt="" class="brand-logo">
        <span class="brand-name">Dr. Ines Carrato</span>
        <span class="brand-sep"></span>
        <span class="brand-md">MD</span>
      </a>
      <button class="nav-toggle" aria-label="Apri menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-links">
        <a href="chi-siamo.html">Chi siamo</a>
        <a href="eventi.html">Eventi</a>
        <a href="contatti.html" aria-current="page">Contatti</a>
      </nav>
    </div>
  </header>

  <main>
  <!-- CONTATTI -->
  <section class="section contact">
    <div class="container contact-inner">
      <div class="contact-info">
        <p class="eyebrow">Contatti</p>
        <h2>Scrivi alla segreteria</h2>
        <div class="rule"></div>
        <p>Email: <a href="mailto:segreteria.eventi.dr.ines.c@gmail.com">segreteria.eventi.dr.ines.c@gmail.com</a></p>
        <p>Telefono: <a href="tel:+393318053227">+39 331 805 3227</a></p>
      </div>

      <!--
        MODULO: per ricevere i messaggi via email senza server, crea un modulo gratuito su
        https://formspree.io e incolla qui sotto l'URL in "action" (es. https://formspree.io/f/abcdwxyz).
        Finché action resta vuoto, il pulsante apre il programma di posta del visitatore.
      -->
      <form class="contact-form" id="contact-form" action="" method="POST" data-mailto="segreteria.eventi.dr.ines.c@gmail.com">
        <label for="nome">Nome e cognome</label>
        <input type="text" id="nome" name="nome" required autocomplete="name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">

        <label for="messaggio">Messaggio</label>
        <textarea id="messaggio" name="messaggio" rows="4" required></textarea>

        <label class="check">
          <input type="checkbox" name="privacy" required>
          <span>Ho letto l'<a href="privacy.html">informativa sulla privacy</a> e acconsento al trattamento dei dati.</span>
        </label>

        <button type="submit" class="btn btn-primary">Invia richiesta</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer-inner">
      <p class="footer-brand"><em>Dr. Ines Carrato</em> <span class="small-caps">| MD</span> · <em>Segreteria Eventi</em></p>
      <div class="footer-links">
        <a href="privacy.html">Privacy policy</a>
        <a href="cookie.html">Cookie policy</a>
        <span>© <span id="year">2026</span></span>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
