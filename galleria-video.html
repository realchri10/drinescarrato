      <!--
        Per aggiungere un video di YouTube copia questo blocco dentro .video-grid
        e sostituisci ID_VIDEO con il codice del video (la parte dopo "v=" nell'indirizzo):

        <figure class="video-item">
          <div class="video-frame"><iframe src="https://www.youtube-nocookie.com/embed/ID_VIDEO" title="Titolo del video" loading="lazy" allowfullscreen></iframe></div>
          <figcaption>Titolo del video</figcaption>
        </figure>

        Per un video caricato sul sito (file .mp4 nella cartella assets/video):

        <figure class="video-item">
          <div class="video-frame"><video src="assets/video/nome-file.mp4" controls preload="metadata"></video></div>
          <figcaption>Titolo del video</figcaption>
        </figure>
